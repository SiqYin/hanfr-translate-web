<!DOCTYPE html>
<html lang="zh-Hans" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<meta name="description" content="汉法辞典 — 汉语 ⇄ 法语双向词典，每个法语词附国际音标，例句标注联诵。">
<title>汉法辞典</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<script>
(function () {
  try {
    var p = localStorage.getItem("hanfr.ui.theme") || "auto";
    var dark = p === "dark" || (p === "auto" && window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brandrow">
    <div class="brand">
      <img class="logo" src="assets/logo.svg" alt="" width="38" height="38">
      <div class="brandtext">
        <h1 data-i18n="app_name">汉法辞典</h1>
        <p class="sub" data-i18n="app_sub">汉语 · 法语 · 音标与联诵</p>
      </div>
    </div>
    <div class="topright">
      <button id="themeBtn" class="iconbtn" type="button" data-mode="auto" data-i18n-aria="theme_label" aria-label="外观" title="外观">
        <svg class="ic ic-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/>
        </svg>
        <svg class="ic ic-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A8.8 8.8 0 1 1 11.2 3a6.8 6.8 0 0 0 9.8 9.8Z"/>
        </svg>
        <svg class="ic ic-auto" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="7" r="2"/>
          <path d="M7 2.4v1.2M7 10.4v1.2M2.4 7h1.2M10.4 7h1.2M3.8 3.8l.9.9M9.3 9.3l.9.9M10.2 3.8l-.9.9M4.7 9.3l-.9.9"/>
          <path d="M21 13.6A8.8 8.8 0 1 1 11.4 4a6.8 6.8 0 0 0 9.6 9.6Z" transform="translate(11,11) scale(0.42)"/>
          <path d="M4.4 19.6 19.6 4.4"/>
        </svg>
      </button>
      <button id="langBtn" class="langsel" type="button" data-i18n-aria="lang_label" aria-label="界面语言">简体中文</button>
      <nav class="tabs" id="tabs" role="tablist">
        <button class="tab on" data-view="dict" role="tab" data-i18n="nav_dict">查词</button>
        <button class="tab" data-view="ai" role="tab" data-i18n="nav_ai">翻译</button>
      </nav>
    </div>
  </div>

  <div id="dictBar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/>
      </svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             data-i18n-ph="search_ph" placeholder="输入中文词或法语词">
      <button id="clear" data-i18n-aria="search_clear" aria-label="清除" hidden>&times;</button>
    </div>
    <div class="hint" id="hint" data-i18n="search_hint"></div>
  </div>

  <div id="aiBar" hidden>
    <div class="segrow">
      <div class="seg" id="dirSeg">
        <button class="on" data-dir="zh2fr" data-i18n="ai_dir_zh2fr">中 → 法</button>
        <button data-dir="fr2zh" data-i18n="ai_dir_fr2zh">法 → 中</button>
      </div>
      <div class="seg sm" id="scriptSeg" hidden>
        <button class="on" data-script="hans" data-i18n="ai_script_hans">简体</button>
        <button data-script="hant" data-i18n="ai_script_hant">繁体</button>
      </div>
    </div>
  </div>
</header>

<main id="main">
  <section id="dictView">
    <section id="histDict" class="hist" hidden></section>
    <section id="results" aria-live="polite"></section>
    <section id="empty" class="empty" hidden>
      <p class="big" data-i18n="empty_title">没有找到</p>
      <p class="small" data-i18n="empty_sub">可以换个说法，或试试单字。</p>
    </section>
  </section>

  <section id="aiView" hidden>
    <div class="ai-in">
      <textarea id="src" rows="4" spellcheck="false" data-i18n-ph="ai_src_ph_zh2fr" placeholder="在这里输入要翻译的内容…"></textarea>
      <div class="ai-bar">
        <span class="cnt" id="srcCount">0</span>
        <button class="linky" id="sample" data-i18n="ai_sample">示例</button>
        <span class="spacer"></span>
        <button class="ghost" id="clearSrc" data-i18n="ai_clear" hidden>清空</button>
        <button class="primary" id="go" data-i18n="ai_go">翻译</button>
      </div>
    </div>

    <div id="histAi" class="hist" hidden></div>

    <div id="out" class="ai-out" hidden>
      <div class="out-head">
        <span class="out-label" id="outLabel"></span>
        <span class="out-meta" id="outMeta"></span>
      </div>
      <div class="tokline" id="tokens"></div>
      <div class="out-actions">
        <button class="ghost" id="copy" data-i18n="ai_copy">复制译文</button>
        <button class="ghost" id="again" data-i18n="ai_again">重新翻译</button>
      </div>
      <div class="tip" data-i18n="ai_tip"></div>
    </div>

    <div id="err" class="err" hidden>
      <div class="err-msg" id="errMsg"></div>
      <div class="err-act">
        <button class="ghost" id="offline" data-i18n="ai_offline">改用词库逐词对照</button>
        <button class="ghost" id="toCfg" data-i18n="ai_cfg">翻译设置</button>
      </div>
    </div>

    <details class="cfg" id="cfg">
      <summary data-i18n="ai_cfg">翻译设置</summary>
      <div class="cfg-body">
        <label class="fld"><span data-i18n="ai_cfg_base">服务地址</span>
          <input id="cfgBase" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="fld"><span data-i18n="ai_cfg_model">模型</span>
          <input id="cfgModel" type="text" autocomplete="off" spellcheck="false"></label>
        <label class="fld"><span data-i18n="ai_cfg_key">API Key</span>
          <input id="cfgKey" type="text" autocomplete="off" spellcheck="false"></label>
        <div class="cfg-act">
          <button class="ghost" id="cfgSave" data-i18n="ai_cfg_save">保存</button>
          <button class="ghost" id="cfgReset" data-i18n="ai_cfg_reset">还原默认</button>
        </div>
        <p class="cfg-note" data-i18n="ai_cfg_note"></p>
      </div>
    </details>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button id="close" class="close" data-i18n-aria="search_clear" aria-label="关闭">&times;</button>
    <div id="sheet-body"></div>
  </div>
</div>

<div id="update-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="update_title">发现新版本</div>
    <div class="upd-msg" id="upd-msg"></div>
    <div class="upd-btns">
      <button id="upd-later" class="btn-ghost" data-i18n="update_later">暂不下载</button>
      <button id="upd-go" class="btn-primary" data-i18n="update_download">前往下载</button>
    </div>
  </div>
</div>

<div id="theme-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="theme_label">外观</div>
    <div class="langlist" id="themelist">
      <button type="button" data-theme-opt="light" data-i18n="theme_light">浅色</button>
      <button type="button" data-theme-opt="dark" data-i18n="theme_dark">深色</button>
      <button type="button" data-theme-opt="auto" data-i18n="theme_auto">跟随系统</button>
    </div>
  </div>
</div>

<div id="lang-dialog" class="upd" hidden>
  <div class="upd-card" role="dialog" aria-modal="true">
    <div class="upd-title" data-i18n="lang_label">界面语言</div>
    <div class="langlist" id="langlist">
      <button type="button" data-lang="hans">简体中文</button>
      <button type="button" data-lang="hant">繁體中文</button>
      <button type="button" data-lang="fr">Français</button>
      <button type="button" data-lang="en">English</button>
    </div>
  </div>
</div>

<div id="pop" class="pop" hidden></div>

<footer class="foot">
  <span id="count"></span>
  <span class="dot">·</span>
  <span>CVDICT · CFDICT · Lexique383</span>
</footer>

<script src="i18n.js"></script>
<script src="data/meta.js"></script>
<script src="liaison.js"></script>
<script src="h_aspire.js"></script>
<script src="ipa.js"></script>
<script src="ipa_query.js"></script>
<script src="zhfr.js"></script>
<script src="fr2zh.js"></script>
<script src="app.js"></script>
<script src="translate.js"></script>
</body>
</html>
